<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>

    <!-- Phone shadow -->
    <filter id="phone-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="950" cy="400" r="80" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="850" cy="50" r="40" fill="#FFFFFF" opacity="0.15"/>

  <!-- Left side - Text content -->
  <!-- Main heading -->
  <text x="80" y="120" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="48" font-weight="bold">OishiMenu</text>

  <!-- Tagline -->
  <text x="80" y="170" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="300" opacity="0.9">Simple yet Powerful</text>
  <text x="80" y="210" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="300" opacity="0.9">Digital Menu &amp; POS</text>

  <!-- Features list -->
  <text x="80" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.8">✓ Easy menu management</text>
  <text x="80" y="300" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.8">✓ Fast order processing</text>
  <text x="80" y="330" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.8">✓ Cloud sync &amp; analytics</text>
  <text x="80" y="360" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" opacity="0.8">✓ Perfect for small business</text>

  <!-- Call to action -->
  <rect x="80" y="400" width="200" height="50" rx="25" fill="#FFFFFF" opacity="0.2"/>
  <text x="180" y="435" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Download Now</text>

  <!-- Right side - Phone mockup -->
  <g transform="translate(650, 50)" filter="url(#phone-shadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="280" height="400" rx="30" ry="30" fill="#1F2937"/>

    <!-- Screen -->
    <rect x="20" y="40" width="240" height="320" rx="20" ry="20" fill="#FFFFFF"/>

    <!-- App header -->
    <rect x="30" y="50" width="220" height="40" rx="8" fill="#6366F1"/>
    <text x="140" y="75" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">POS System</text>

    <!-- Menu items -->
    <rect x="40" y="110" width="120" height="12" rx="6" fill="#E5E7EB"/>
    <text x="245" y="121" text-anchor="end" fill="#6366F1" font-family="Arial, sans-serif" font-size="10" font-weight="bold">₫50K</text>

    <rect x="40" y="135" width="100" height="12" rx="6" fill="#E5E7EB"/>
    <text x="245" y="146" text-anchor="end" fill="#6366F1" font-family="Arial, sans-serif" font-size="10" font-weight="bold">₫75K</text>

    <rect x="40" y="160" width="140" height="12" rx="6" fill="#E5E7EB"/>
    <text x="245" y="171" text-anchor="end" fill="#6366F1" font-family="Arial, sans-serif" font-size="10" font-weight="bold">₫30K</text>

    <rect x="40" y="185" width="90" height="12" rx="6" fill="#E5E7EB"/>
    <text x="245" y="196" text-anchor="end" fill="#6366F1" font-family="Arial, sans-serif" font-size="10" font-weight="bold">₫65K</text>

    <!-- Divider -->
    <rect x="40" y="220" width="200" height="2" rx="1" fill="#E5E7EB"/>

    <!-- Total -->
    <text x="40" y="245" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TOTAL:</text>
    <text x="245" y="245" text-anchor="end" fill="#10B981" font-family="Arial, sans-serif" font-size="14" font-weight="bold">₫220K</text>

    <!-- Payment button -->
    <rect x="40" y="270" width="200" height="35" rx="18" fill="#6366F1"/>
    <text x="140" y="292" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Process Payment</text>

    <!-- Stats cards -->
    <rect x="40" y="320" width="60" height="30" rx="8" fill="#F3F4F6"/>
    <text x="70" y="335" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="8">Today</text>
    <text x="70" y="345" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10" font-weight="bold">₫2.5M</text>

    <rect x="110" y="320" width="60" height="30" rx="8" fill="#F3F4F6"/>
    <text x="140" y="335" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="8">Orders</text>
    <text x="140" y="345" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10" font-weight="bold">47</text>

    <rect x="180" y="320" width="60" height="30" rx="8" fill="#F3F4F6"/>
    <text x="210" y="335" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="8">Items</text>
    <text x="210" y="345" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10" font-weight="bold">124</text>
  </g>

  <!-- Bottom brand accent -->
  <rect x="0" y="480" width="1024" height="20" fill="#FFFFFF" opacity="0.1"/>

  <!-- Small logo/icon in corner -->
  <circle cx="980" cy="40" r="25" fill="#FFFFFF" opacity="0.2"/>
  <text x="980" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">O</text>
</svg>